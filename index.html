<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🧰 Werkzeugliste</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-wrap" style="display:none;">
    <div class="login-card">
      <h1>🧰 Werkzeugliste</h1>
      <p class="login-sub">Bitte anmelden</p>
      <form id="loginForm">
        <label>E-Mail
          <input type="email" id="loginEmail" autocomplete="email" required />
        </label>
        <label>Passwort
          <input type="password" id="loginPass" autocomplete="current-password" required />
        </label>
        <div class="login-error" id="loginError"></div>
        <button type="submit">Anmelden</button>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" style="display:none;">
    <header class="app-header">
      <h1>🧰 Werkzeugliste <span class="role-tag" id="roleTag"></span></h1>
      <div class="header-actions">
        <button id="themeToggle" class="theme-btn" title="Design umschalten">🌙</button>
        <button id="logoutBtn" class="logout-btn" title="Abmelden">⎋</button>
      </div>
    </header>

    <div class="entries-section">
      <div class="vehicle-tabs" id="tabTabs">
        <div class="vehicle-tab active" data-tab="werkzeuge">
          <span class="tab-name">Werkzeuge</span>
        </div>
        <div class="vehicle-tab" data-tab="baumaterialien">
          <span class="tab-name">Baumaterialien</span>
        </div>
      </div>

      <div class="section-header">
        <h2 id="sectionTitle" class="section-title-inline">Werkzeuge</h2>
        <button id="openSheet" class="fab-btn editor-only" title="Neu anlegen">+</button>
      </div>

      <div class="status-bar" id="status"></div>

      <input type="search" id="searchBar" class="search-bar"
             placeholder="Suchen…" autocomplete="off" />

      <div id="tableWrap" class="entries-table-wrap"></div>
      <div id="emptyState" class="empty-state">Keine Einträge gefunden.</div>
    </div>
  </div>

  <!-- BOTTOM SHEET -->
  <div id="sheetOverlay" class="sheet-overlay" style="display:none;">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <button id="sheetClose" class="sheet-close" title="Schließen">✕</button>
      <h3 id="sheetTitle">Neu anlegen</h3>
      <form id="sheetForm"></form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
